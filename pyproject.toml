[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflectai"
version = "0.1.0"
description = "A multi-provider AI agent with reflection and iterative refinement"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "streamlit>=1.37", "openai", "ollama", "python-dotenv", "pydantic",
  "PyYAML", "pandas", "plotly"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
reflectai = "reflectai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
